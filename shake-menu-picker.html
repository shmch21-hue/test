<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍹 흔들어서 메뉴 추천 (100종 에디션)</title>
  <meta name="description" content="스마트폰을 흔들면 100가지 맛집 메뉴 중 오늘의 추천이 튀어나오는 웹앱">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f59e0b;
      --accent-glow: #fbbf24;
      --neon-pink: #ec4899;
      --neon-cyan: #06b6d4;
      --neon-green: #10b981;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    .container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 1;
    }

    /* 헤더 */
    .header {
      text-align: center;
      padding: 6px 0;
    }
    .header h1 {
      font-size: 1.55rem;
      font-weight: 900;
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* 카테고리 필터 태그 */
    .category-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      width: 100%;
      padding: 4px 2px;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar { display: none; }

    .pill {
      background: #1e293b;
      color: var(--text-dim);
      border: 1px solid #334155;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border-color: #f59e0b;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    /* 메인 셰이커 상자 영역 */
    .shake-stage {
      width: 100%;
      background: var(--card);
      border-radius: 24px;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
      position: relative;
      min-height: 310px;
    }

    .shaker-box {
      font-size: 5.2rem;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
      cursor: pointer;
      position: relative;
    }

    .shaker-box.shaking {
      animation: violentShake 0.15s infinite alternate ease-in-out;
    }

    @keyframes violentShake {
      0% { transform: translate(-8px, -5px) rotate(-12deg) scale(1.05); }
      100% { transform: translate(8px, 5px) rotate(12deg) scale(1.1); }
    }

    .guide-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      margin-top: 16px;
      text-align: center;
    }
    .sub-guide {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* 셰이크 에너지 게이지 */
    .energy-wrap {
      width: 85%;
      height: 16px;
      background: #0f172a;
      border-radius: 10px;
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
    }
    .energy-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #f59e0b, #ec4899);
      transition: width 0.1s linear;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.6);
    }
    .energy-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.68rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 2px #000;
    }

    /* 결과 팝업 카드 */
    .result-card {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .result-emoji {
      font-size: 4.8rem;
      margin-bottom: 4px;
      animation: bounce 0.6s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .result-name {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--accent-glow);
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
    }
    .result-tag {
      background: #334155;
      color: var(--neon-cyan);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: bold;
      margin-top: 6px;
    }
    .result-desc {
      font-size: 0.9rem;
      color: #e2e8f0;
      margin-top: 10px;
      line-height: 1.4;
      max-width: 290px;
    }

    /* 버튼 영역 */
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.97); }

    .btn-secondary {
      background: #334155;
      color: #fff;
      box-shadow: none;
      margin-top: 6px;
      font-size: 0.92rem;
      padding: 12px;
    }

    /* 최근 뽑은 메뉴 기록 */
    .history-card {
      width: 100%;
      background: var(--card);
      border-radius: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .history-title {
      font-size: 0.82rem;
      font-weight: bold;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .history-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .history-tag {
      background: #0f172a;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.72rem;
      color: var(--accent-glow);
      border: 1px solid #334155;
    }

    .pc-sim-btn {
      background: transparent;
      border: 1px dashed #475569;
      color: var(--text-dim);
      padding: 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>🍹 흔들어서 메뉴 추천</h1>
      <p>100가지 맛집 메뉴 중 오늘의 운명은?</p>
    </div>

    <!-- 카테고리 필터 (6종) -->
    <div class="category-pills">
      <button class="pill active" onclick="setCategory('all', this)">✨ 전체 (100종)</button>
      <button class="pill" onclick="setCategory('korean', this)">🍚 한식 (22)</button>
      <button class="pill" onclick="setCategory('chinese', this)">🥟 중식 (16)</button>
      <button class="pill" onclick="setCategory('japanese', this)">🍣 일식 (18)</button>
      <button class="pill" onclick="setCategory('western', this)">🍔 양식·패스트 (18)</button>
      <button class="pill" onclick="setCategory('snack', this)">🍢 분식 (14)</button>
      <button class="pill" onclick="setCategory('asian', this)">🥗 아시안·헬시 (12)</button>
    </div>

    <!-- 메인 셰이커 인터랙션 영역 -->
    <div class="shake-stage">
      <div id="stage-shaking" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="shaker-icon" class="shaker-box" onclick="simulateManualShake()">🎁</div>
        <div id="guide-txt" class="guide-text">폰을 위아래로 마구 흔드세요!</div>
        <div id="sub-guide-txt" class="sub-guide">흔들림 에너지 100%를 채우면 개봉됩니다</div>

        <!-- 에너지 게이지 -->
        <div class="energy-wrap">
          <div id="energy-bar" class="energy-bar"></div>
          <div id="energy-text" class="energy-text">0%</div>
        </div>
      </div>

      <!-- 결과 팝업 화면 -->
      <div id="stage-result" class="result-card">
        <div id="res-emoji" class="result-emoji">🥘</div>
        <div id="res-name" class="result-name">제육볶음</div>
        <div id="res-tag" class="result-tag">#한식의_정석</div>
        <div id="res-desc" class="result-desc">"직장인 점심의 불패 신화! 매콤달콤 고기반찬으로 밥 두 공기 뚝딱!"</div>
      </div>
    </div>

    <!-- 액션 버튼 -->
    <button id="btn-perm" class="btn-main" onclick="requestSensorPermission()">
      🚀 흔들기 센서 시작 (권한 허용)
    </button>
    <button id="btn-retry" class="btn-main btn-secondary" onclick="resetShake()" style="display:none;">
      🔄 다시 흔들어서 뽑기
    </button>

    <!-- PC 테스트용 흔들기 버튼 -->
    <button class="pc-sim-btn" onclick="simulateManualShake()">
      🖱️ PC 테스트: 클릭하여 강제로 흔들기 (+25%)
    </button>

    <!-- 최근 뽑은 메뉴 기록 -->
    <div class="history-card">
      <div class="history-title">
        <span>🕒 최근 추천받은 메뉴</span>
        <span style="cursor:pointer; font-size:0.75rem; color:var(--text-dim);" onclick="clearHistory()">초기화</span>
      </div>
      <div id="history-list" class="history-tags">
        <span style="font-size:0.75rem; color:var(--text-dim);">아직 뽑은 기록이 없습니다.</span>
      </div>
    </div>
  </div>

    // ==========================================
    // 사운드 신디사이저 (Web Audio API)
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playShakeSound() {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function playFanfare() {
      try {
        if (!audioCtx) return;
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          }, i * 110);
        });
      } catch (e) {}
    }

    // ==========================================
    // 흔들기 감지 & 물리 에너지 로직
    // ==========================================
    let currentCategory = 'all';
    let shakeEnergy = 0;
    let isRevealed = false;
    let lastX = 0, lastY = 0, lastZ = 0;
    let lastShakeTime = 0;
    let decayTimer = null;

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
    }

    async function requestSensorPermission() {
      initAudio();

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== 'granted') {
            alert('흔들기 감지를 위해 모션 센서 권한이 필요합니다.');
            return;
          }
        } catch (e) {
          console.warn('iOS Motion Sensor Error:', e);
        }
      }

      window.addEventListener('devicemotion', handleMotion, true);
      document.getElementById('btn-perm').style.display = 'none';
      startEnergyDecay();
    }

    function handleMotion(e) {
      if (isRevealed) return;

      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc || acc.x === null) return;

      const now = Date.now();
      const deltaX = Math.abs(acc.x - lastX);
      const deltaY = Math.abs(acc.y - lastY);
      const deltaZ = Math.abs(acc.z - lastZ);
      const speed = deltaX + deltaY + deltaZ;

      if (speed > 18 && (now - lastShakeTime > 90)) {
        lastShakeTime = now;
        addShakeEnergy(speed * 0.45);
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    }

    function simulateManualShake() {
      initAudio();
      if (isRevealed) return;
      addShakeEnergy(25);
    }

    function addShakeEnergy(amount) {
      if (isRevealed) return;

      shakeEnergy = Math.min(shakeEnergy + amount, 100);
      updateEnergyUI();

      const box = document.getElementById('shaker-icon');
      box.classList.add('shaking');
      setTimeout(() => box.classList.remove('shaking'), 150);

      playShakeSound();
      if (navigator.vibrate) navigator.vibrate(35);

      if (shakeEnergy >= 100) {
        revealMenu();
      }
    }

    function startEnergyDecay() {
      if (decayTimer) clearInterval(decayTimer);
      decayTimer = setInterval(() => {
        if (!isRevealed && shakeEnergy > 0) {
          shakeEnergy = Math.max(shakeEnergy - 3, 0);
          updateEnergyUI();
        }
      }, 180);
    }

    function updateEnergyUI() {
      const percent = Math.round(shakeEnergy);
      document.getElementById('energy-bar').style.width = percent + "%";
      document.getElementById('energy-text').innerText = percent + "%";

      if (percent > 70) {
        document.getElementById('shaker-icon').innerText = "🔥";
        document.getElementById('guide-txt').innerText = "거의 다 됐습니다! 더 격렬하게!!";
      } else if (percent > 30) {
        document.getElementById('shaker-icon').innerText = "🍹";
        document.getElementById('guide-txt').innerText = "좋습니다! 멈추지 마세요!";
      } else {
        document.getElementById('shaker-icon').innerText = "🎁";
        document.getElementById('guide-txt').innerText = "폰을 위아래로 마구 흔드세요!";
      }
    }

    // ==========================================
    // 100가지 풀에서 메뉴 추첨 & 오픈
    // ==========================================
    function revealMenu() {
      isRevealed = true;
      if (decayTimer) clearInterval(decayTimer);

      let pool = [];
      if (currentCategory === 'all') {
        Object.keys(FOOD_DATABASE).forEach(k => pool.push(...FOOD_DATABASE[k]));
      } else {
        pool = FOOD_DATABASE[currentCategory] || FOOD_DATABASE['korean'];
      }

      const pick = pool[Math.floor(Math.random() * pool.length)];

      document.getElementById('stage-shaking').style.display = 'none';
      const resStage = document.getElementById('stage-result');
      resStage.style.display = 'flex';

      document.getElementById('res-emoji').innerText = pick.emoji;
      document.getElementById('res-name').innerText = pick.name;
      document.getElementById('res-tag').innerText = pick.tag;
      document.getElementById('res-desc').innerText = `"${pick.desc}"`;

      document.getElementById('btn-retry').style.display = 'flex';

      playFanfare();
      if (navigator.vibrate) navigator.vibrate([100, 50, 200]);
      launchConfetti();

      saveHistory(pick.name, pick.emoji);
    }

    function resetShake() {
      isRevealed = false;
      shakeEnergy = 0;
      updateEnergyUI();

      document.getElementById('stage-result').style.display = 'none';
      document.getElementById('stage-shaking').style.display = 'flex';
      document.getElementById('btn-retry').style.display = 'none';

      startEnergyDecay();
    }

    // ==========================================
    // 히스토리 관리
    // ==========================================
    function saveHistory(name, emoji) {
      let history = JSON.parse(localStorage.getItem('shake_menu_history') || '[]');
      history.unshift({ name: name, emoji: emoji, time: new Date().toLocaleTimeString().slice(0, 5) });
      if (history.length > 7) history.pop();
      localStorage.setItem('shake_menu_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('shake_menu_history') || '[]');
      const container = document.getElementById('history-list');
      if (history.length === 0) {
        container.innerHTML = `<span style="font-size:0.75rem; color:var(--text-dim);">아직 뽑은 기록이 없습니다.</span>`;
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="history-tag">${item.emoji} ${escapeHtml(item.name)} (${item.time})</div>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('shake_menu_history');
      renderHistory();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // ==========================================
    // 컨페티(폭죽) 애니메이션 (Canvas)
    // ==========================================
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#10b981', '#fbbf24'];
      for (let i = 0; i < 70; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10
        });
      }

      let frames = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.4;
          p.rotation += p.vRot;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          ctx.restore();
        });

        frames++;
        if (frames < 90) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderHistory();
    });
  </script>
